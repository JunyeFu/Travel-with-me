<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Travel With Me</title>

    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./css/tokens.css?v=20260510-v10" />
    <link rel="stylesheet" href="./css/layout.css?v=20260901-s5" />
    <link rel="stylesheet" href="./css/components.css?v=20260901-s5" />
  </head>

  <body data-mobile-view="list">
    <a href="#map" class="skip-link">跳转到地图内容</a>
    <div class="workspace-shell">
      <div class="workspace-tabs" id="workspace-tabs"></div>
      <div class="mobile-view-switch" role="tablist" aria-label="移动端视图切换">
        <button
          id="mobile-list-tab"
          type="button"
          class="mobile-view-btn active"
          data-mobile-view="list"
          role="tab"
          aria-controls="itinerary-panel"
          aria-selected="true"
        >
          行程
        </button>
        <button
          id="mobile-map-tab"
          type="button"
          class="mobile-view-btn"
          data-mobile-view="map"
          role="tab"
          aria-controls="map-panel"
          aria-selected="false"
        >
          地图
        </button>
      </div>
      <div
        class="status-panel"
        id="status-panel"
        role="status"
        aria-live="polite"
        aria-atomic="true"
      >
        正在加载地图...
      </div>
      <div class="app-layout">
        <div class="sidebar" id="itinerary-panel" role="tabpanel" aria-labelledby="mobile-list-tab">
          <div class="header">
            <div class="header-top">
              <div class="title-row">
                <div class="trip-title-display">
                  <span id="trip-title-text">五一北京行程</span>
                </div>
              </div>
              <div class="header-actions">
                <button type="button" class="share-trip-btn" id="share-trip-btn">分享长图</button>
              </div>
            </div>
            <p id="trip-subtitle">点击下方行程卡片，右侧地图将自动飞跃至对应地点</p>
          </div>
          <div class="tabs-container" id="tabs-container"></div>
          <div class="itinerary-list" id="itinerary-container"></div>
        </div>

        <div class="map-container" id="map-panel" role="tabpanel" aria-labelledby="mobile-map-tab">
          <div id="map"></div>
          <div class="route-daylight-legend" id="route-daylight-legend" hidden>
            <span>日照示意 · 夜间浅蓝 / 正午中性黄</span>
            <div class="route-daylight-scale" aria-hidden="true"></div>
            <div class="route-daylight-hours">
              <span>00</span><span>06</span><span>12</span><span>18</span><span>24</span>
            </div>
            <small>06 日出 / 18 日落（示意）· 未定时间用灰色</small>
          </div>
        </div>
      </div>
    </div>

    <script type="module" src="./js/main.js?v=20260901-s4-s5e"></script>
  </body>
</html>
